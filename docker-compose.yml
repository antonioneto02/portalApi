services:
  portal-api:
    image: portal-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-api
    restart: unless-stopped
    ports:
      - "3014:3014"
    env_file:
      - .env
    environment:
      CERT_DIR: C:/certs
    volumes:
      # Pasta inteira (nao so o codigo copiado na imagem): restart via
      # supervisor pega o que estiver salvo no disco na hora, sem rebuild.
      - C:/Projetos/portalApi:C:/app
      - C:/Projetos/Certificados:C:/certs:ro
